<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로스코 인트로 테스트</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a0a;
  color: #fff;
  font-family: 'Noto Serif KR', serif;
  overflow: hidden;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.intro-container {
  display: flex;
  gap: 12px;
  height: 85vh;
  padding: 0 2rem;
}

.intro-card {
  aspect-ratio: 3 / 4;
  height: 100%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 2px;
}

.intro-card .color-field {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
}

.intro-card .color-field .top-block {
  flex: 1;
  margin: 8% 7% 3% 7%;
  border-radius: 3px;
}

.intro-card .color-field .bottom-block {
  flex: 0.8;
  margin: 3% 7% 8% 7%;
  border-radius: 3px;
}

/* 카드 1: 유예가 허락되지 않은 시간성 */
.card-1 .color-field .top-block {
  background: linear-gradient(180deg, #1a1208 0%, #2d1f0e 50%, #0d0a05 100%);
}
.card-1 .color-field .bottom-block {
  background: linear-gradient(180deg, #3d2a12 0%, #1a1208 100%);
}

/* 카드 2: 어둠을 투과하는 노란 온기 */
.card-2 .color-field .top-block {
  background: linear-gradient(180deg, #c4952a 0%, #e8b84a 50%, #8a6518 100%);
}
.card-2 .color-field .bottom-block {
  background: linear-gradient(180deg, #1a1208 0%, #2d1f0e 100%);
}

/* 카드 3: 흐릿한 회색의 장막 */
.card-3 .color-field .top-block {
  background: linear-gradient(180deg, #4a4a52 0%, #6b6b73 50%, #3a3a42 100%);
}
.card-3 .color-field .bottom-block {
  background: linear-gradient(180deg, #5a5a62 0%, #2a2a32 100%);
}

/* 카드 4: 채도가 소거된 시간 */
.card-4 .color-field .top-block {
  background: linear-gradient(180deg, #8a8580 0%, #b5afa9 50%, #6a6560 100%);
}
.card-4 .color-field .bottom-block {
  background: linear-gradient(180deg, #5a5550 0%, #3a3530 100%);
}

/* 카드 5: 훼손되지 않는 고유함의 방어선 */
.card-5 .color-field .top-block {
  background: linear-gradient(180deg, #8b1a1a 0%, #a83232 50%, #5c1010 100%);
}
.card-5 .color-field .bottom-block {
  background: linear-gradient(180deg, #3d1510 0%, #1a0a08 100%);
}

/* 텍스트 레이어 */
.intro-card .text-layer {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 2rem 1.2rem;
}

.intro-card .phrase {
  font-size: 1.05rem;
  font-weight: 400;
  line-height: 1.7;
  letter-spacing: -0.02em;
  color: #f5f0eb;
  text-shadow: 0 2px 16px rgba(0,0,0,0.85), 0 0 30px rgba(0,0,0,0.5);
  transition: opacity 0.4s, transform 0.4s;
}

.intro-card .detail {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2.5rem 1.5rem;
  font-size: 0.95rem;
  font-weight: 300;
  line-height: 1.8;
  letter-spacing: 0.01em;
  color: rgba(245, 240, 235, 0.85);
  text-shadow: 0 2px 16px rgba(0,0,0,0.9);
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.4s 0.1s, transform 0.4s 0.1s;
  text-align: center;
}

.intro-card:hover .phrase {
  opacity: 0;
  transform: translateY(-10px);
}

.intro-card:hover .detail {
  opacity: 1;
  transform: translateY(0);
}

/* 모바일 */
@media (max-width: 768px) {
  .intro-container {
    flex-direction: column;
    gap: 8px;
    height: auto;
    padding: 1rem;
  }
  
  .intro-card {
    aspect-ratio: auto;
    height: 18vh;
    width: 100%;
  }
  
  .intro-card .phrase {
    font-size: 0.9rem;
    padding: 0;
  }
  
  .intro-card .detail {
    font-size: 0.85rem;
    padding: 1rem;
  }
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="intro-container">
  <div class="intro-card card-1">
    <div class="color-field">
      <div class="top-block"></div>
      <div class="bottom-block"></div>
    </div>
    <span class="phrase">유예가 허락되지 않은 시간성</span>
    <span class="detail">시간의 무게<br>기다릴 수 없는 압박</span>
  </div>

  <div class="intro-card card-2">
    <div class="color-field">
      <div class="top-block"></div>
      <div class="bottom-block"></div>
    </div>
    <span class="phrase">어둠을 투과하는 노란 온기</span>
    <span class="detail">절망 속에서도<br>스며드는 따뜻함</span>
  </div>

  <div class="intro-card card-3">
    <div class="color-field">
      <div class="top-block"></div>
      <div class="bottom-block"></div>
    </div>
    <span class="phrase">흐릿한 회색의 장막</span>
    <span class="detail">불확실함<br>앞이 보이지 않는 안개</span>
  </div>

  <div class="intro-card card-4">
    <div class="color-field">
      <div class="top-block"></div>
      <div class="bottom-block"></div>
    </div>
    <span class="phrase">채도가 소거된 시간</span>
    <span class="detail">색이 빠진 일상<br>무기력한 반복</span>
  </div>

  <div class="intro-card card-5">
    <div class="color-field">
      <div class="top-block"></div>
      <div class="bottom-block"></div>
    </div>
    <span class="phrase">훼손되지 않는 고유함의 방어선</span>
    <span class="detail">지켜야 할<br>나만의 본질</span>
  </div>
</div>

</body>
</html>
