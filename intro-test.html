<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로스코 인트로</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --text: #f5f0eb;
  --text-shadow: 0 2px 20px rgba(0,0,0,0.95), 0 0 50px rgba(0,0,0,0.6);
  --font: 'Noto Serif KR', serif;
}

body {
  word-break: keep-all;
  overflow-wrap: break-word;
  letter-spacing: -0.02em;
  line-height: 1.65;
  margin: 0; padding: 0; box-sizing: border-box;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
  -webkit-font-smoothing: antialiased;
}

.intro-container {
  display: flex;
  gap: 20px;
  max-width: 1100px;
}

.intro-card {
  aspect-ratio: 3 / 4;
  width: 180px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 2px;
  flex-shrink: 0;
}

/* ===== 로스코 색면: 단일 캔버스에 그라디언트로 번짐 재현 ===== */
.rothko-field {
  position: absolute;
  inset: 0;
  /* 기본 배경색 = 캔버스 톤 */
}

/* 위쪽 색면: 위에서 중간까지, 아래로 갈수록 투명해짐 */
.color-top {
  position: absolute;
  top: 8%;
  left: 7%;
  right: 7%;
  height: 42%;
  filter: blur(4px);
  border-radius: 2px;
}

/* 아래쪽 색면: 중간에서 아래까지, 위로 갈수록 투명해짐 */
.color-bottom {
  position: absolute;
  bottom: 8%;
  left: 7%;
  right: 7%;
  height: 35%;
  filter: blur(4px);
  border-radius: 2px;
}

/* --- 카드 1: 유예가 허락되지 않은 시간성 --- */
.card-1 .rothko-field { background: #0d0a05; }
.card-1 .color-top { background: linear-gradient(180deg, #2d1f0e 0%, #1a1208 60%, rgba(26,18,8,0) 100%); }
.card-1 .color-bottom { background: linear-gradient(0deg, #3d2a12 0%, #2d1f0e 40%, rgba(45,31,14,0) 100%); }

/* --- 카드 2: 어둠을 투과하는 노란 온기 --- */
.card-2 .rothko-field { background: #1a1208; }
.card-2 .color-top { background: linear-gradient(180deg, #c4952a 0%, #d4a83a 40%, rgba(180,130,30,0) 100%); }
.card-2 .color-bottom { background: linear-gradient(0deg, #2a1c08 0%, #1f1508 30%, rgba(26,18,8,0) 100%); }

/* --- 카드 3: 흐릿한 회색의 장막 --- */
.card-3 .rothko-field { background: #28282f; }
.card-3 .color-top { background: linear-gradient(180deg, #5a5a64 0%, #4a4a52 50%, rgba(74,74,82,0) 100%); }
.card-3 .color-bottom { background: linear-gradient(0deg, #4a4a55 0%, #3e3e46 30%, rgba(62,62,70,0) 100%); }

/* --- 카드 4: 채도가 소거된 시간 --- */
.card-4 .rothko-field { background: #2e2a28; }
.card-4 .color-top { background: linear-gradient(180deg, #a09a94 0%, #8a8580 50%, rgba(138,133,128,0) 100%); }
.card-4 .color-bottom { background: linear-gradient(0deg, #5a5550 0%, #4a4540 30%, rgba(74,69,64,0) 100%); }

/* --- 카드 5: 훼손되지 않는 고유함의 방어선 --- */
.card-5 .rothko-field { background: #1a0a08; }
.card-5 .color-top { background: linear-gradient(180deg, #982828 0%, #7a1818 50%, rgba(122,24,24,0) 100%); }
.card-5 .color-bottom { background: linear-gradient(0deg, #301210 0%, #25100a 30%, rgba(37,16,10,0) 100%); }

/* ===== 텍스트 ===== */
.phrase {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 16px 12px;
  font-size: 0.88rem;
  font-weight: 400;
  line-height: 1.7;
  letter-spacing: -0.01em;
  color: var(--text);
  text-shadow: var(--text-shadow);
  transition: opacity 0.35s, transform 0.35s;
}

.detail {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  font-size: 0.85rem;
  font-weight: 300;
  line-height: 1.8;
  color: rgba(245,240,235,0.8);
  text-shadow: var(--text-shadow);
  text-align: center;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.35s 0.1s, transform 0.35s 0.1s;
  z-index: 2;
}

.intro-card:hover .phrase { opacity: 0; transform: translateY(-8px); }
.intro-card:hover .detail { opacity: 1; transform: translateY(0); }

/* ===== 모바일 ===== */
@media (max-width: 768px) {
  body { padding: 32px 16px; align-items: flex-start; padding-top: 48px; }
  .intro-container { flex-direction: column; align-items: center; gap: 22px; }
  .intro-card { width: 160px; }
  .phrase { font-size: 0.82rem; padding: 12px 8px; }
  .detail { font-size: 0.78rem; padding: 16px 12px; }
}
</style>
</head>
<body>

<div class="intro-container">
  <div class="intro-card card-1">
    <div class="rothko-field"></div>
    <div class="color-top"></div>
    <div class="color-bottom"></div>
    <span class="phrase">유예가 허락되지 않은<br>시간성</span>
    <span class="detail">시간의 무게<br>기다릴 수 없는 압박</span>
  </div>

  <div class="intro-card card-2">
    <div class="rothko-field"></div>
    <div class="color-top"></div>
    <div class="color-bottom"></div>
    <span class="phrase">어둠을 투과하는<br>노란 온기</span>
    <span class="detail">절망 속에서도<br>스며드는 따뜻함</span>
  </div>

  <div class="intro-card card-3">
    <div class="rothko-field"></div>
    <div class="color-top"></div>
    <div class="color-bottom"></div>
    <span class="phrase">흐릿한 회색의 장막</span>
    <span class="detail">불확실함<br>앞이 보이지 않는 안개</span>
  </div>

  <div class="intro-card card-4">
    <div class="rothko-field"></div>
    <div class="color-top"></div>
    <div class="color-bottom"></div>
    <span class="phrase">채도가 소거된 시간</span>
    <span class="detail">색이 빠진 일상<br>무기력한 반복</span>
  </div>

  <div class="intro-card card-5">
    <div class="rothko-field"></div>
    <div class="color-top"></div>
    <div class="color-bottom"></div>
    <span class="phrase">훼손되지 않은<br>고유함의 방어선</span>
    <span class="detail">지켜야 할<br>나만의 본질</span>
  </div>
</div>

</body>
</html>
