<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로스코 인트로 테스트</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a0a;
  color: #fff;
  font-family: 'Noto Serif KR', serif;
  overflow: hidden;
  height: 100vh;
}

.intro-container {
  display: flex;
  height: 100vh;
  width: 100vw;
}

.intro-card {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  cursor: pointer;
  transition: flex 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.intro-card:hover {
  flex: 1.5;
}

/* 로스코 스타일 색면 배경 */
.intro-card .color-field {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
}

.intro-card .color-field .top-block {
  flex: 1;
  margin: 8% 6% 3% 6%;
  border-radius: 4px;
  transition: opacity 0.4s;
}

.intro-card .color-field .bottom-block {
  flex: 0.8;
  margin: 3% 6% 8% 6%;
  border-radius: 4px;
  transition: opacity 0.4s;
}

/* 카드 1: 유예가 허락되지 않은 시간성 — 어두운 갈색/검정 */
.card-1 .color-field .top-block {
  background: linear-gradient(180deg, #1a1208 0%, #2d1f0e 50%, #0d0a05 100%);
}
.card-1 .color-field .bottom-block {
  background: linear-gradient(180deg, #3d2a12 0%, #1a1208 100%);
}

/* 카드 2: 어둠을 투과하는 노란 온기 — 노란/오렌지 */
.card-2 .color-field .top-block {
  background: linear-gradient(180deg, #c4952a 0%, #e8b84a 50%, #8a6518 100%);
}
.card-2 .color-field .bottom-block {
  background: linear-gradient(180deg, #1a1208 0%, #2d1f0e 100%);
}

/* 카드 3: 흐릿한 회색의 장막 — 회색/푸른 회색 */
.card-3 .color-field .top-block {
  background: linear-gradient(180deg, #4a4a52 0%, #6b6b73 50%, #3a3a42 100%);
}
.card-3 .color-field .bottom-block {
  background: linear-gradient(180deg, #5a5a62 0%, #2a2a32 100%);
}

/* 카드 4: 채도가 소거된 시간 — 무채색/퇴색 */
.card-4 .color-field .top-block {
  background: linear-gradient(180deg, #8a8580 0%, #b5afa9 50%, #6a6560 100%);
}
.card-4 .color-field .bottom-block {
  background: linear-gradient(180deg, #5a5550 0%, #3a3530 100%);
}

/* 카드 5: 훼손되지 않는 고유함의 방어선 — 진한 빨강/적갈색 */
.card-5 .color-field .top-block {
  background: linear-gradient(180deg, #8b1a1a 0%, #a83232 50%, #5c1010 100%);
}
.card-5 .color-field .bottom-block {
  background: linear-gradient(180deg, #3d1510 0%, #1a0a08 100%);
}

/* 텍스트 */
.intro-card .text-overlay {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 1.5rem;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.5s 0.2s, transform 0.5s 0.2s;
}

.intro-card:hover .text-overlay {
  opacity: 1;
  transform: translateY(0);
}

.text-overlay .phrase {
  font-size: 1.1rem;
  font-weight: 400;
  line-height: 1.6;
  letter-spacing: -0.02em;
  text-shadow: 0 2px 12px rgba(0,0,0,0.8);
  color: #f5f0eb;
}

.text-overlay .emotion {
  margin-top: 0.8rem;
  font-size: 0.8rem;
  color: rgba(245, 240, 235, 0.5);
  font-style: italic;
}

/* 기본: 문구만 중앙에 떠 있게 */
.intro-card .default-text {
  position: absolute;
  z-index: 2;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  font-size: 0.95rem;
  font-weight: 300;
  letter-spacing: 0.15em;
  color: rgba(245, 240, 235, 0.7);
  text-shadow: 0 2px 8px rgba(0,0,0,0.9);
  transition: opacity 0.3s;
  line-height: 1.8;
}

.intro-card:hover .default-text {
  opacity: 0;
}

/* 모바일 */
@media (max-width: 768px) {
  .intro-container {
    flex-direction: column;
  }
  
  .intro-card .default-text {
    writing-mode: horizontal-tb;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
  }
  
  .intro-card .text-overlay {
    opacity: 1;
    transform: translateY(0);
  }
  
  .text-overlay .phrase {
    font-size: 0.9rem;
  }
  
  .intro-card:hover .default-text {
    opacity: 0;
  }
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="intro-container">
  <div class="intro-card card-1">
    <div class="color-field">
      <div class="top-block"></div>
      <div class="bottom-block"></div>
    </div>
    <span class="default-text">유예가 허락되지 않은 시간성</span>
    <div class="text-overlay">
      <div class="phrase">유예가 허락되지 않은 시간성</div>
      <div class="emotion">시간의 무게, 기다릴 수 없는 압박</div>
    </div>
  </div>

  <div class="intro-card card-2">
    <div class="color-field">
      <div class="top-block"></div>
      <div class="bottom-block"></div>
    </div>
    <span class="default-text">어둠을 투과하는 노란 온기</span>
    <div class="text-overlay">
      <div class="phrase">어둠을 투과하는 노란 온기</div>
      <div class="emotion">절망 속에서도 스며드는 따뜻함</div>
    </div>
  </div>

  <div class="intro-card card-3">
    <div class="color-field">
      <div class="top-block"></div>
      <div class="bottom-block"></div>
    </div>
    <span class="default-text">흐릿한 회색의 장막</span>
    <div class="text-overlay">
      <div class="phrase">흐릿한 회색의 장막</div>
      <div class="emotion">불확실함, 앞이 보이지 않는 안개</div>
    </div>
  </div>

  <div class="intro-card card-4">
    <div class="color-field">
      <div class="top-block"></div>
      <div class="bottom-block"></div>
    </div>
    <span class="default-text">채도가 소거된 시간</span>
    <div class="text-overlay">
      <div class="phrase">채도가 소거된 시간</div>
      <div class="emotion">색이 빠진 일상, 무기력한 반복</div>
    </div>
  </div>

  <div class="intro-card card-5">
    <div class="color-field">
      <div class="top-block"></div>
      <div class="bottom-block"></div>
    </div>
    <span class="default-text">훼손되지 않는 고유함의 방어선</span>
    <div class="text-overlay">
      <div class="phrase">훼손되지 않는 고유함의 방어선</div>
      <div class="emotion">지켜야 할 나만의 본질</div>
    </div>
  </div>
</div>

</body>
</html>
